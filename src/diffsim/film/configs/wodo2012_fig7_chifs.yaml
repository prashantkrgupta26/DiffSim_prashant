# Wodo & Ganapathysubramanian CMS 55 (2012) Fig. 7 — solvent
# selectivity, chi = (1, .3, .6): the FULLERENE is less soluble and
# wets the solvent-lean free surface. Parameters read from the
# committed campaign table (benchmarks/phase-field/wodo_nova.py FIG2D
# ("7","chifs")): Np = 100, Nf = 5, Bi = 0.3, blend 1:1, phi_s0 = 0.75,
# kappa = 1.1485e-4 (the N=100 eps^2 ratio). Model config = the fig67
# gate-passing one (CHC noise 1e-3, var-mob 1e-3, b_reg 1e-3);
# 250x100 = the paper's own 2-D mesh.
name: wodo2012_fig7_chifs
comment: Wodo 2012 Fig 7, chi_fs=0.6 (fullerene less soluble)
physics:
  chi: [1.0, 0.3, 0.6]
  N: [100, 5, 1]
  blend: {phi_p0: 0.125, phi_f0: 0.125}
  kappa: 1.1485e-4            # 2e-4 * 2.05/3.57 (their eps^2 ratio)
  b_reg: 1.0e-3
evaporation:
  Bi: 0.3
mobility:
  model: variable
  D_p: 1.0e-3
  D_f: 1.0e-3
domain:
  dim: 2
  Lx: 2.5
  resolution: [250, 100]
numerics:
  dt0: 1.0e-4
  noise: 1.0e-3
  noise_seed: 761
  ic_noise: 0.01
  ic_seed: 762
  linsolver: cudss
  device_assembly: true
stop:
  h_min: 0.25
  phis_stop: 0.05
  max_steps: 200000
  wall_cap: null
output:
  snap_h: [0.9, 0.7, 0.6, 0.5, 0.4]
preflight: strict
