site_name: DiffSim — differentiable FEM, taught properly
docs_dir: docs/site_src
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle: {icon: material/weather-night, name: dark}
    - scheme: slate
      primary: deep purple
      toggle: {icon: material/weather-sunny, name: light}
  features: [navigation.sections, navigation.footer, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
# nav is (re)generated by: python tutorials/build_site.py
nav:
  - Home: index.md
  - Solver projects:
    - "Overview": projects/index.md
    - "Poisson / Shifted-Boundary Method": projects/poisson-sbm.md
    - "Navier–Stokes": projects/navier-stokes.md
    - "Heat & Mass Transfer": projects/heat-mass.md
    - "Phase Field & Learned Thermodynamics": projects/phase-field.md
    - "Differentiable Design": projects/differentiable.md
    - "Adaptivity — Spatial & Temporal": projects/adaptivity.md
  - Theory:
    - "Adjoint-Readiness Requirements for cuFEM Device Adaptivity": theory/cufem_adjoint_readiness_memo.md
    - "Relaxed Classification for Differentiable Immersed Optimization": theory/n6_relaxed_classification_brief.md
    - "Local p-Refinement Bands for the Shifted Boundary Method": theory/p2_band_problem_statement.md
    - "The p2 Band Around a Shifted Boundary": theory/p2_band_study_for_students.md
    - "P0 — Ternary Phase-Field with Evaporation and Crystallization": theory/phasefield_formulation_p0.md
  - Curriculum:
    - A. Foundations:
      - A1_mms_convergence: A1_mms_convergence.md
      - A2_boundary_conditions: A2_boundary_conditions.md
      - A3_shifted_boundary: A3_shifted_boundary.md
      - A4_mixed_elements: A4_mixed_elements.md
      - A5_three_dimensions: A5_three_dimensions.md
      - A6_complex_geometry: A6_complex_geometry.md
    - B. Nonlinear:
      - B1_bratu_newton: B1_bratu_newton.md
      - B2_bratu_3d: B2_bratu_3d.md
    - C. Time:
      - C1_heat_bdf: C1_heat_bdf.md
      - C2_advection_diffusion: C2_advection_diffusion.md
    - D. Flow:
      - D1_ns_mms: D1_ns_mms.md
      - D2_lid_driven_cavity: D2_lid_driven_cavity.md
      - D3_cylinder: D3_cylinder.md
    - E. Differentiable:
      - E1_shape_optimization: E1_shape_optimization.md
      - E2_genie_diffsbm: E2_genie_diffsbm.md
    - F. Phase field:
      - F1_allen_cahn: F1_allen_cahn.md
      - F2_cahn_hilliard: F2_cahn_hilliard.md
      - F3_adaptivity: F3_adaptivity.md
    - P. Performance:
      - P1_cost_model_and_scaling: P1_cost_model_and_scaling.md
      - P2_solver_showdown: P2_solver_showdown.md
