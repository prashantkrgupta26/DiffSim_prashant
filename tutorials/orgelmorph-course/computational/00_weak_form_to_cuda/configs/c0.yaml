# C0 - weak form to CUDA. Canonical run record.
# The reaction-diffusion MMS verification: spatial order, Newton convergence,
# analytic-Jacobian check, and the production-kernel cross-check.
alpha: 12.0
p1_levels: [3, 4, 5, 6]
p2_levels: [2, 3, 4, 5]
newton_tol: 1.0e-10
precision: fp64

modes:
  quick:            # <2 min smoke: fewer/coarser levels
    p1_levels: [3, 4, 5]
    p2_levels: [2, 3, 4]
  reference:        # the gated run behind baseline.yaml
    p1_levels: [3, 4, 5, 6]
    p2_levels: [2, 3, 4, 5]
