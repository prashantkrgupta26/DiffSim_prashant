# C6 baseline — scientific invariants of the nonlinear-solver diagnostics.
# These are behavioural gates (converged/pinned/ill-conditioned), NOT bitwise
# GPU identity: exact iteration counts and condition numbers vary a little by
# card/BLAS, so bounds are one-sided and generous where appropriate.
checks:
  # 1. a healthy poly Newton solve converges quadratically in a few iterations
  healthy_iters:            {min: 1, max: 5}
  healthy_clamp_fired:      {equals: false}
  # 2. stopping tests fire (well-scaled field)
  stop_by_residual:         {min: 1}
  stop_by_abs_update:       {min: 1}
  # 3. FH safeguards genuinely act and the step still converges
  safe_proj_dofs:           {min: 1}
  safe_converged:           {equals: true}
  # 4a. the stagnation case GENUINELY does not converge; its fix does
  stag_converged:           {equals: false}
  stag_clamp_fraction:      {min: 0.5, max: 1.0}
  stag_fixed_converged:     {equals: true}
  # 4b. the adaptive controller is pinned at the floor with LTE above tol
  mindt_all_at_floor:       {equals: true}
  mindt_lte_exceeds_tol:    {equals: true}
  # 4c. the FH Jacobian condition number climbs by >1 order toward the wall
  cond_ratio:               {min: 10.0}
  all_gates_pass:           {equals: true}
