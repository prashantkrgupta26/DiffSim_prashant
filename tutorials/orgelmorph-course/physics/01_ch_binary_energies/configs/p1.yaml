# P1 — binary Cahn-Hilliard, two free energies. Canonical run record.
# Reproduces EXPECTED.md at mode=reference (64x64, 250 steps).
#
# Cost modes (spec: quick <2 min, reference 5-30 min, research documented):
#   quick      coarse 32x32 / 60 steps smoke — the CI micro-test tier
#   reference  the EXPECTED.md tutorial numbers (64x64, 250 steps)
#   research   finer 128x128, longer horizon (for the coarsening study)
energy: both          # poly | fh | both
level: 6              # 2^level cells/side; 6 = 64x64
steps: 250
dt: 0.02
M: 1.0                # Cahn-Hilliard mobility
kappa: 5.0e-4         # gradient-energy coefficient (sets interface width)
fh_A: 1.0             # Flory-Huggins entropic scale (~1/N)
fh_B: 2.5             # Flory-Huggins enthalpic scale (~chi)
amp: 0.05             # initial random perturbation amplitude
seed: 3
precision: fp64

modes:
  quick:
    level: 5          # 32x32
    steps: 60
  reference:
    level: 6          # 64x64 — the EXPECTED.md numbers
    steps: 250
  research:
    level: 7          # 128x128
    steps: 600
