# P1 doc-vs-data mapping: each course-document macro (latex/numbers/p1.tex)
# vs the reference-mode results.json path it must match, within tolerance.
# Drives the docs-build staleness gate (common/check_doc_staleness.py).
tex: ../../latex/numbers/p1.tex
macros:
  POLYFend:      {path: poly.Fend,       rtol: 0.05}
  POLYFintpeak:  {path: poly.Fint_peak,  rtol: 0.05}
  POLYFintend:   {path: poly.Fint_end,   rtol: 0.08}
  POLYcrange:    {path: poly.c_max,      rtol: 0.05, extract: high}
  POLYmass:      {path: poly.mass_drift, max: 1.0e-10}
  FHFend:        {path: fh.Fend,         rtol: 0.05}
  FHFintpeak:    {path: fh.Fint_peak,    rtol: 0.06}
  FHFintend:     {path: fh.Fint_end,     rtol: 0.10}
  FHcrange:      {path: fh.c_max,        rtol: 0.05, extract: high}
